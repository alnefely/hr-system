; ============================================================
;  Worker دائم لطابور النظام عبر Supervisor
; ============================================================
;
;  التركيب (Ubuntu/Debian):
;    sudo apt install supervisor
;    sudo cp deploy/supervisor/hr-queue-worker.conf /etc/supervisor/conf.d/
;    ; عدّل المسار والمستخدم تحت حسب السيرفر
;    sudo supervisorctl reread
;    sudo supervisorctl update
;    sudo supervisorctl status hr-queue-worker:*
;
;  وبعدها في .env على السيرفر:
;    QUEUE_SUPERVISED=true
;  ثم: php artisan config:cache
;  (عشان الـ scheduler يبطّل يشغّل worker تاني كل دقيقة)
;
;  بعد أي رفع لكود جديد لازم الـ worker يعيد التحميل:
;    php artisan queue:restart
;
;  --max-time=3600: الـ worker بيعيد تشغيل نفسه كل ساعة عشان أي تسريب
;  ذاكرة مايتراكمش، و Supervisor بيرجّعه فوراً (autorestart).

[program:hr-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hr-system/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/hr-system
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/hr-system/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
